<section class="benefits" id="metodo" aria-labelledby="benefits-title">
  <div class="section-inner">
    <div class="section-head">
      <h2 class="section-title" id="benefits-title">¿Por qué elegir nuestro centro de idiomas?</h2>
      <p class="section-lead">
        Una experiencia pensada para que aprendas con claridad, práctica constante y acompañamiento
        cercano.
      </p>
    </div>

    <div class="benefits__grid">
      @for (benefit of benefits; track benefit.title) {
        <article class="benefit">
          <span
            class="benefit__icon"
            [class.benefit__icon--green]="benefit.tone === 'green'"
            [class.benefit__icon--amber]="benefit.tone === 'amber'"
          >
            <app-icon [name]="benefit.icon" [size]="24"></app-icon>
          </span>
          <h3>{{ benefit.title }}</h3>
          <p>{{ benefit.text }}</p>
        </article>
      }
    </div>
  </div>
</section>
