<section class="impact" id="impacto" aria-labelledby="impact-title">
  <div class="section-inner">
    <div class="section-head">
      <h2 class="section-title" id="impact-title">Nuestro impacto</h2>
      <p class="section-lead">
        Una academia pensada para que avances con confianza, desde tu primera clase hasta tu
        siguiente nivel.
      </p>
    </div>

    <div class="stats">
      @for (stat of stats; track stat.label) {
        <article class="stat">
          <strong>{{ stat.value }}</strong>
          <span>{{ stat.label }}</span>
          <p>{{ stat.text }}</p>
        </article>
      }
    </div>

    <p class="impact__note">
      <app-icon name="check" [size]="15"></app-icon>
      <span>
        ¿No sabes en qué nivel estás?
        <a
          href="mailto:informes@comich.edu.pe?subject=Evaluaci%C3%B3n%20de%20nivel%20en%20Comzhichi"
        >
          Solicita tu evaluación de nivel
        </a>
        y te orientamos.
      </span>
    </p>
  </div>
</section>
