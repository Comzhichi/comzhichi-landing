<section class="how" id="como-funciona" aria-labelledby="how-title">
  <div class="section-inner">
    <div class="section-head">
      <h2 class="section-title" id="how-title">¿Cómo funciona?</h2>
      <p class="section-lead">
        Cuatro pasos simples para pasar de la primera consulta a tu primera clase.
      </p>
    </div>

    <ol class="steps">
      @for (step of steps; track step.title; let index = $index) {
        <li class="step">
          <span class="step__number" aria-hidden="true">{{ index + 1 }}</span>
          <div class="step__body">
            <h3>{{ step.title }}</h3>
            <p>{{ step.text }}</p>
          </div>
        </li>
      }
    </ol>

    <p class="how__note">
      ¿Listo para empezar?
      <a
        href="mailto:informes@comich.edu.pe?subject=Quiero%20informaci%C3%B3n%20sobre%20los%20cursos"
      >
        Solicita información
      </a>
    </p>
  </div>
</section>
