name: Deploy Comzhichi Landing

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Angular application
        run: npx ng build --base-href /comzhichi-landing/ --output-path dist/site

      - name: Prepare GitHub Pages
        run: |
          if [ -d dist/site/browser ]; then
            cp -r dist/site/browser/. dist/site/
          fi
          touch dist/site/.nojekyll
          cp dist/site/index.html dist/site/404.html

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    needs: build

    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
